<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market Detail / 市场详情</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div>
          <div class="title">Market Detail / 市场详情</div>
          <div class="subtle"><a href="index.html">Back to list / 返回列表</a></div>
        </div>
        <div class="subtle" id="detail-meta"></div>
      </div>

      <div class="card">
        <div class="controls">
          <div class="control" style="min-width: 260px;">
            <label for="market-id">Market ID / 市场ID</label>
            <input id="market-id" type="text" placeholder="Enter market id / 输入市场ID">
          </div>
          <button id="load-detail">Load / 加载</button>
        </div>
        <div class="controls actions">
          <button id="detail-filter" class="secondary">Filter / 过滤</button>
          <button id="detail-parse">Parse / 解析</button>
          <button id="detail-prompt" class="secondary">Prompt / 生成</button>
          <button id="detail-run-all">Run All / 全流程</button>
        </div>
        <div class="subtle" id="detail-status"></div>
        <pre id="detail-log" class="action-log"></pre>
      </div>

      <div id="detail-content" class="grid"></div>
    </div>

    <script src="detail.js"></script>
  </body>
</html>
