version: pm_agents_repo_hygiene_v1

# Machine-generated research data belongs on JRS.  Git keeps only compact
# metadata, small golden evidence, and files that active code still consumes.
generated_artifact_max_bytes: 5242880
untracked_artifact_archive_min_bytes: 0

# Historical debt budgets are monotone: cleanup batches lower these measured
# ceilings; new research may not grow dated reports or top-level machine data.
max_dated_analysis_reports: 651
max_untracked_dated_analysis_reports: 2
max_top_level_analysis_machine_artifacts: 148
max_untracked_top_level_analysis_machine_artifacts: 0
max_top_level_analysis_machine_bytes: 8942901
top_level_analysis_machine_artifact_max_bytes: 1500000
max_parallel_machine_format_stems: 0

# Temporary migration ceiling.  Batch 4 removes or registers the historical
# wrappers and lowers this number; CI prevents new wrappers in the meantime.
max_entrypoints_outside_production_closure: 64

# Research scripts are immutable evidence only when they represent a distinct
# experiment. New city/date runs must use an existing runner + run manifest.
# The 2026-08-09 cleanup moved 17 already-referenced scripts out of untracked
# limbo and into git, so the tracked-only counters rose by exactly that debt
# transfer. The combined tracked+untracked ceiling is the invariant that must
# only move downward; registering an existing dependency cannot masquerade as
# creating a new experiment.
max_research_experiment_entrypoints: 439
max_repeated_research_function_bodies: 173
max_total_research_experiment_entrypoints: 441

# Local worktree debt is part of the audit: otherwise an agent can create a
# hundred untracked one-off runners while the tracked-only check stays green.
# This cleanup lowered the live worktree budgets to the measured post-cleanup
# state; future changes may only keep or reduce them.
max_untracked_research_experiment_entrypoints: 2
max_research_version_families: 9
max_research_version_family_copies: 18
max_worktree_repeated_function_extra_copies: 414

# Legacy research runners that still hard-code repository docs/analysis paths.
# The old detector falsely reported zero because it missed the common combined
# string literal. Each migrated family lowers this measured ceiling; new code
# must use JRS run manifests for machine output and durable historical inputs.
max_research_scripts_referencing_docs_analysis: 401

# These are still consumed by active ops/source code.  They remain explicit
# exceptions until their consumers use the JRS research artifact resolver.
large_generated_allowlist:
  - docs/analysis/2026-06/generated/intraday_weather_regime_atlas_v1/intraday_weather_regime_state_rows.csv
  - docs/analysis/2026-07/generated/tmax_distribution_p6_shadow_telemetry_v1/shadow_events.csv
