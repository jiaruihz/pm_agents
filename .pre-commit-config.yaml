repos:
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    - id: black
      language_version: python3.9
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: detect-private-key
    - id: check-merge-conflict
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
    - id: gitleaks
      args: ["--redact"]
