repos:
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    - id: black
      language_version: python3.12
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: detect-private-key
    - id: check-merge-conflict
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
    - id: gitleaks
      args: ["--redact"]
-   repo: local
    hooks:
    - id: pm-agents-project-structure
      name: PM Agents project structure contract
      entry: python scripts/ops/check_project_structure.py --strict
      language: python
      additional_dependencies:
      - pydantic>=2.8,<3
      - pyyaml>=6,<7
      pass_filenames: false
