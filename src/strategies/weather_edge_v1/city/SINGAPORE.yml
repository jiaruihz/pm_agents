identity:
  city_key: singapore
  display_name: Singapore
  market_unit: C
  timezone: Asia/Singapore

station:
  station_name: Singapore Changi Airport
  station_code: WSSS
  iata_code: SIN
  object_type: airport
  settlement_scope: Only the Changi airport station counts for this market.

resolution:
  metric: daily_high_temperature
  finalized_required: true
  unit_rule: Use whole-degree Celsius values, matching Singapore-style weather-market rules.
  station_match_rule: Must match Singapore Changi Airport Station / WSSS. Do not substitute a generic Singapore city page.
  settlement_note: Use the finalized same-station WU History / Daily reading for the target date.

sources:
  primary_settlement:
    family: wunderground
    page_type: history_daily
    location_object: airport_station
    station_code: WSSS
    role: settlement_truth
    use_for: Final market resolution, replay, and truth-table review.
    do_not_use_for: Do not treat provisional history as final settlement.
  primary_trading_anchor:
    family: wunderground
    page_type: hourly_forecast
    location_object: airport_station
    station_code: WSSS
    role: trading_anchor
    use_for: Record target-day high, peak timing, and whether the airport path is still vulnerable to afternoon convection.
    do_not_use_for: Do not map the displayed forecast integer directly to a guaranteed settlement call.
  consensus_sources:
    - family: weather.com
      page_type: same_stack_reference
      location_object: airport_preferred
      use_for: Explain market consensus inside the TWC stack.
      do_not_use_for: Do not replace WSSS with a generic Singapore page.
  supporting_sources:
    - family: official_aviation_weather
      page_type: airport_weather
      location_object: airport
      use_for: Sanity-check cloud, humidity, and airport observations.
    - family: checkwx
      page_type: metar_taf
      location_object: airport
      use_for: Check current airport observation and convective timing.
    - family: accuweather
      page_type: airport_page
      location_object: airport
      use_for: Cross-check the daily high and tropical cloud risk.
  forbidden_sources:
    - family: wunderground
      page_type: city_page
      location_object: city
      why_forbidden: A Singapore city page is not the WSSS airport contract.
    - family: accuweather
      page_type: city_page
      location_object: city
      why_forbidden: Dense urban pages can diverge from the airport path.
    - family: meteoblue
      page_type: city_page
      location_object: city
      why_forbidden: Use only to explain market drift.

operator_notes:
  summary: Singapore has excellent airport data coverage, but it is not a lazy market. Same-station WU Hourly is the anchor, while airport observation pages matter because equatorial convection can abruptly cap the day.
  why_this_station: Changi is the clean airport object for a Singapore contract and avoids downtown urban heat contamination.
  main_risks:
    - Afternoon thunderstorms clipping the high.
    - Low cloud or marine flow flattening the midday ramp.
    - Market participants anchoring to generic Singapore city pages.
  common_wrong_anchor:
    - Downtown Singapore pages instead of WSSS.
    - App pages that describe “Singapore” without a station match.
  usage_order:
    - Open Polymarket rules and confirm WSSS plus Celsius.
    - Open same-station WU Hourly and record target-day high plus likely peak hour.
    - Open same-station WU History / Daily to verify station identity and later use it for settlement review.
    - Check CheckWX and one more airport observation source for convective timing.
    - Use city pages only as wrong-anchor diagnostics.
