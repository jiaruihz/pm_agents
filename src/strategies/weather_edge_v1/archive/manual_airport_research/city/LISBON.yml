identity:
  city_key: lisbon
  display_name: Lisbon
  market_unit: C
  timezone: Europe/Lisbon

station:
  station_name: Lisbon Humberto Delgado Airport
  station_code: LPPT
  iata_code: LIS
  object_type: airport
  settlement_scope: Only the Lisbon airport station counts for this market.

resolution:
  metric: daily_high_temperature
  finalized_required: true
  unit_rule: Use whole-degree Celsius values for Lisbon-style airport temperature contracts.
  station_match_rule: Must match Lisbon Airport Station / LPPT. Do not substitute a generic Lisbon city page.
  settlement_note: Use the finalized same-station WU History / Daily reading for the target date.

sources:
  primary_settlement:
    family: wunderground
    page_type: history_daily
    location_object: airport_station
    station_code: LPPT
    role: settlement_truth
    use_for: Final market resolution, replay, and truth-table review.
    do_not_use_for: Do not resolve from city pages or provisional history.
  primary_trading_anchor:
    family: wunderground
    page_type: hourly_forecast
    location_object: airport_station
    station_code: LPPT
    role: trading_anchor
    use_for: Record target-day high, peak timing, and whether the daytime trend is stable.
    do_not_use_for: Do not treat the forecast integer as a guaranteed settlement bucket.
  consensus_sources:
    - family: weather.com
      page_type: same_stack_reference
      location_object: airport_preferred
      use_for: Explain broader market consensus inside the TWC stack.
      do_not_use_for: Do not replace the same-station WU anchor with a generic Lisbon page.
  supporting_sources:
    - family: official_aviation_weather
      page_type: airport_weather
      location_object: airport
      use_for: Sanity-check airport observations, wind, and cloud.
    - family: accuweather
      page_type: airport_page
      location_object: airport
      use_for: Cross-check the daily high and warming path.
    - family: meteoblue
      page_type: airport_page
      location_object: airport
      use_for: Cross-check trend and uncertainty.
  forbidden_sources:
    - family: wunderground
      page_type: city_page
      location_object: city
      why_forbidden: Lisbon city pages are not the LPPT airport contract object.
    - family: accuweather
      page_type: city_page
      location_object: city
      why_forbidden: City warmth can diverge from the airport path.
    - family: meteoblue
      page_type: city_page
      location_object: city
      why_forbidden: Use only for noise diagnostics.

operator_notes:
  summary: Lisbon is a clean, relatively stable airport market when strong marine cooling is absent. Same-station WU Hourly should lead; support pages mainly confirm whether the airport warms smoothly into the afternoon.
  why_this_station: Humberto Delgado is a major airport object with strong cross-provider coverage and fewer violent inland-style jumps.
  main_risks:
    - Marine moderation keeping the peak below optimistic city pages.
    - Wind shifts flattening the warm side of the distribution.
    - Thin cloud reducing the top bucket by one degree.
  common_wrong_anchor:
    - Generic Lisbon city pages rather than LPPT.
    - Riverfront or downtown pages that are not the airport object.
  usage_order:
    - Open Polymarket rules and confirm LPPT plus Celsius.
    - Open same-station WU Hourly and record target-day high plus likely peak hour.
    - Open same-station WU History / Daily to verify station identity and later use it for settlement review.
    - Check airport support pages for marine-cooling disagreement.
    - Use city pages only to diagnose noise.
