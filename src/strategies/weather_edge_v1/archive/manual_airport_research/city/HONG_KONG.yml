identity:
  city_key: hong_kong
  display_name: Hong Kong
  market_unit: C
  timezone: Asia/Hong_Kong

station:
  station_name: Hong Kong International Airport
  station_code: VHHH
  iata_code: HKG
  object_type: airport
  settlement_scope: Only the Hong Kong International Airport station counts for this market.

resolution:
  metric: daily_high_temperature
  finalized_required: true
  unit_rule: Use whole-degree Celsius values, matching Hong Kong temperature-market rules.
  station_match_rule: Must match Hong Kong International Airport Station / VHHH. Do not substitute a generic Hong Kong city page.
  settlement_note: Use the finalized same-station WU History / Daily reading for the target date.

sources:
  primary_settlement:
    family: wunderground
    page_type: history_daily
    location_object: airport_station
    station_code: VHHH
    role: settlement_truth
    use_for: Final market resolution, replay, and truth-table review.
    do_not_use_for: Do not resolve from city pages or provisional history.
  primary_trading_anchor:
    family: wunderground
    page_type: hourly_forecast
    location_object: airport_station
    station_code: VHHH
    role: trading_anchor
    use_for: Record target-day high, likely peak timing, and whether the marine airport path is stable.
    do_not_use_for: Do not treat the displayed forecast integer as a guaranteed settlement bucket.
  consensus_sources:
    - family: weather.com
      page_type: same_stack_reference
      location_object: airport_preferred
      use_for: Explain broader market consensus inside the TWC stack.
      do_not_use_for: Do not replace VHHH with a Hong Kong city page.
  supporting_sources:
    - family: official_aviation_weather
      page_type: airport_weather
      location_object: airport
      use_for: Sanity-check wind, cloud, and humidity.
    - family: checkwx
      page_type: metar_taf
      location_object: airport
      use_for: Check the current airport observation and whether the thermal path is tracking.
    - family: accuweather
      page_type: airport_page
      location_object: airport
      use_for: Cross-check the daily high and marine moderation risk.
  forbidden_sources:
    - family: wunderground
      page_type: city_page
      location_object: city
      why_forbidden: A generic Hong Kong city page is not the VHHH airport contract.
    - family: accuweather
      page_type: city_page
      location_object: city
      why_forbidden: Dense urban pages can run warmer than the airport.
    - family: meteoblue
      page_type: city_page
      location_object: city
      why_forbidden: Use only to explain market noise.

operator_notes:
  summary: Hong Kong is a good data-quality airport market and usually behaves more smoothly than continental transition cities. The main edge often comes from avoiding overreaction to warm city narratives when the airport stays more marine-moderated.
  why_this_station: VHHH is a major airport object with strong same-station coverage and clear identity across weather vendors.
  main_risks:
    - Marine moderation clipping the warm tail.
    - Humidity and haze slowing the ramp.
    - Urban Hong Kong pages overstating warmth versus the airport.
  common_wrong_anchor:
    - Downtown Hong Kong city pages instead of VHHH.
    - App pages that do not clearly identify the airport object.
  usage_order:
    - Open Polymarket rules and confirm VHHH plus Celsius.
    - Open same-station WU Hourly and record target-day high plus likely peak hour.
    - Open same-station WU History / Daily to verify station identity and later use it for settlement review.
    - Check CheckWX and one more airport support page for current observation context.
    - Use city pages only to estimate wrong-anchor money.
