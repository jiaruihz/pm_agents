version: 1
strategy: weather_edge_v1
execution_mode: paper_only

profiles:
  - name: weather_edge_b0p_v1
    source: weather-predict/roi_compare_branches.py::BaselineGFSSource
    model_selector: weather-predict/edge_backtest.py::PerCityOptimal
  - name: weather_edge_b3f_hybrid_v1
    source: weather-predict/roi_compare_branches.py::EnsembleHybridSource
    model_selector: weather-predict/edge_backtest.py::PerCityOptimal

paper_combos:
  - locked+equal
  - dynamic+equal
  - independent+equal

thresholds:
  min_edge: 0.10

data_paths:
  weather_predict_root: /home/rui/projects/weather-predict
  weather_predict_python: /home/rui/projects/weather-predict/.venv/bin/python
  weather_cache_global_full: /home/rui/projects/weather-predict/cache_global_full
  polymarket_data_root: runtime/weather_edge_v1/market_data
  paper_decisions_jsonl: runtime/weather_edge_v1/paper_decisions.jsonl
  live_orderbook_glob: runtime/weather_edge_v1/market_data/live_orderbook/**/*.jsonl.gz

price_priority:
  - local_orderbook_jsonl_best_ask
  - live_snapshot_orderbook_best_ask
  - outcome_price
  - clob_price_history_fallback

safety:
  live_order_placement: disabled
  require_wu_for_model_probabilities: true
  allow_clob_history_as_primary_entry_price: false
