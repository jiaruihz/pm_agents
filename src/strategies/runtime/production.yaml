# The mount name is a compatibility contract; UUID is the physical identity.
# A same-named replacement disk must fail closed instead of becoming production.
production_storage_root: /Volumes/jrs
production_storage_volume_uuid: 93F5EA71-2AAB-4A45-9A21-18220BBE4614
archive_storage_root: /Volumes/jrs-archive
archive_storage_volume_uuid: 748B704B-E074-40C1-A5F0-AC9205B52E9F
# Immutable retired collector products. Consumers resolve semantic products
# through the shared loader; they never embed targeted/full-ladder paths.
historical_data_feed_runtime_root: /Volumes/jrs-archive/weather_data_feed_service_runtime
