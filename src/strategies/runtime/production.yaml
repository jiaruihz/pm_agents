version: weather_production_v1
host_role: mac_current_production
operational_repo_root: /Users/deepsleep/projects/pm_agents
# Bounded refresh executes the same committed code as current production.
# Operational scripts/status remain owned by operational_repo_root.
canonical_refresh_checkout_root: /Users/deepsleep/projects/pm_agents_prod
# The mount name is a compatibility contract; UUID is the physical identity.
# A same-named replacement disk must fail closed instead of becoming production.
production_storage_root: /Volumes/jrs
production_storage_volume_uuid: 93F5EA71-2AAB-4A45-9A21-18220BBE4614
archive_storage_root: /Volumes/jrs-archive
archive_storage_volume_uuid: 748B704B-E074-40C1-A5F0-AC9205B52E9F
canonical_db_path: /Volumes/jrs/pm_agents/runtime/weather.db
compatibility_db_paths:
  - runtime/weather.db
data_feed_runtime_root: /Volumes/jrs/weather_data_feed_service_runtime
market_books_root: /Volumes/jrs/weather_data_feed_service_runtime/market_books
strategy_snapshot_root: /Volumes/jrs/weather_data_feed_service_runtime/strategy_snapshots
market_ladder_snapshot_root: /Volumes/jrs/weather_data_feed_service_runtime/market_ladder_snapshots
forecast_output_root: /Volumes/jrs/weather_data_feed_service_runtime/forecast
pm_runtime_root: /Volumes/jrs/pm_agents/runtime
research_artifact_root: /Volumes/jrs-archive/pm_agents/research/artifact_store
canonical_tmux_socket: weather-data-feed-jrs
canonical_tmux_binary: /opt/homebrew/Cellar/tmux/3.6b/bin/tmux
market_proxy_state_path: /Volumes/jrs/weather_data_feed_service_runtime/config/market_proxy.json
market_proxy_default_url: http://127.0.0.1:7897

# This is the current Mac production desired state. Historical/research
# metadata remains in instances.yaml; only runtimes listed here are required to
# survive a production change or canonical tmux rebuild.
allowed_unmanaged_sessions:
  - weather_canonical_refresh  # bounded one-shot, allowed to finish naturally

managed_runtimes:
  - instance_id: weather_jrs_context_keeper
    tmux_session: weather_jrs_context_keeper
    role: infrastructure
    execution_mode: infrastructure
    recovery_policy: manual

  - instance_id: weather_dashboard_api
    tmux_session: weather_dashboard_api
    role: dashboard_api
    execution_mode: read_only_api
    checkout_root: /Users/deepsleep/projects/pm_agents_prod
    start_script: scripts/ops/start_weather_dashboard_api_jrs_tmux.sh
    health_url: http://127.0.0.1:8000/health
    health_format: http_json
    accepted_health_statuses: [ok]
    dependencies: [weather_jrs_context_keeper]
    recovery_policy: safe

  - instance_id: weather_data_feed_jrs
    tmux_session: weather_data_feed_jrs
    role: data_feed
    execution_mode: collector
    checkout_root: /Users/deepsleep/projects/pm_agents_data_feed_prod
    start_script: scripts/ops/start_mac_weather_data_feed_jrs_tmux.sh
    health_path: /Volumes/jrs/weather_data_feed_service_runtime/output/observations/latest.json
    max_health_age_sec: 1800
    dependencies: [weather_forecast_curve_collector_v1, weather_market_books]
