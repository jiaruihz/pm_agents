identity:
  city_key: osaka
  display_name: Osaka
  market_unit: C
  timezone: Asia/Tokyo

station:
  station_name: Kansai International Airport
  station_code: RJBB
  iata_code: KIX
  object_type: airport
  settlement_scope: Only the Kansai airport station counts for this market.

resolution:
  metric: daily_high_temperature
  finalized_required: true
  unit_rule: Use whole-degree Celsius values, matching Osaka-style weather-market rules.
  station_match_rule: Must match Kansai International Airport Station / RJBB. Do not substitute a generic Osaka city page.
  settlement_note: Use the finalized same-station WU History / Daily reading for the target date.

sources:
  primary_settlement:
    family: wunderground
    page_type: history_daily
    location_object: airport_station
    station_code: RJBB
    role: settlement_truth
    use_for: Final market resolution, replay, and truth-table review.
    do_not_use_for: Do not treat provisional history as final settlement.
  primary_trading_anchor:
    family: wunderground
    page_type: hourly_forecast
    location_object: airport_station
    station_code: RJBB
    role: trading_anchor
    use_for: Record target-day high, peak timing, and whether the bay-airport path is warming cleanly.
    do_not_use_for: Do not map the displayed forecast integer directly to a guaranteed settlement call.
  consensus_sources:
    - family: weather.com
      page_type: same_stack_reference
      location_object: airport_preferred
      use_for: Explain market consensus inside the TWC stack.
      do_not_use_for: Do not replace RJBB with a generic Osaka page.
  supporting_sources:
    - family: official_aviation_weather
      page_type: airport_weather
      location_object: airport
      use_for: Sanity-check wind, cloud, and airport observations.
    - family: checkwx
      page_type: metar_taf
      location_object: airport
      use_for: Check current airport observation and whether the intraday ramp is on track.
    - family: accuweather
      page_type: airport_page
      location_object: airport
      use_for: Cross-check the daily high and marine moderation risk.
  forbidden_sources:
    - family: wunderground
      page_type: city_page
      location_object: city
      why_forbidden: An Osaka city page is not the RJBB airport contract.
    - family: accuweather
      page_type: city_page
      location_object: city
      why_forbidden: Urban pages can diverge from the bay-airport path.
    - family: meteoblue
      page_type: city_page
      location_object: city
      why_forbidden: Use only to explain wrong-anchor flow.

operator_notes:
  summary: Osaka should be treated as a bay-airport contract at RJBB. Same-station WU Hourly is the anchor, while airport observation pages matter because marine moderation and cloud can trim the top bucket.
  why_this_station: Kansai is the clean airport object for an Osaka contract and avoids central-city heat-island contamination.
  main_risks:
    - Bay moderation clipping the warm side of the range.
    - Low cloud or rain bands delaying the daytime peak.
    - Market participants anchoring to Osaka city pages instead of RJBB.
  common_wrong_anchor:
    - Osaka city forecast pages with no RJBB match.
    - Kansai region pages that ignore the airport object.
  usage_order:
    - Open Polymarket rules and confirm RJBB plus Celsius.
    - Open same-station WU Hourly and record target-day high plus likely peak hour.
    - Open same-station WU History / Daily to verify station identity and later use it for settlement review.
    - Check CheckWX or another airport observation source for current ramp confirmation.
    - Use city pages only as wrong-anchor diagnostics.
