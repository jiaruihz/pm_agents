identity:
  city_key: brussels
  display_name: Brussels
  market_unit: C
  timezone: Europe/Brussels

station:
  station_name: Brussels Airport
  station_code: EBBR
  iata_code: BRU
  object_type: airport
  settlement_scope: Only the Brussels Airport station counts for this market.

resolution:
  metric: daily_high_temperature
  finalized_required: true
  unit_rule: Use whole-degree Celsius values for Brussels-style airport temperature contracts.
  station_match_rule: Must match Brussels Airport Station / EBBR. Do not substitute a Brussels city page.
  settlement_note: Use the finalized same-station WU History / Daily reading for the target date.

sources:
  primary_settlement:
    family: wunderground
    page_type: history_daily
    location_object: airport_station
    station_code: EBBR
    role: settlement_truth
    use_for: Final market resolution, replay, and truth-table review.
    do_not_use_for: Do not resolve from city pages or provisional history.
  primary_trading_anchor:
    family: wunderground
    page_type: hourly_forecast
    location_object: airport_station
    station_code: EBBR
    role: trading_anchor
    use_for: Record target-day high, peak timing, and whether low cloud threatens the top bucket.
    do_not_use_for: Do not treat the shown forecast integer as a guaranteed settlement value.
  consensus_sources:
    - family: weather.com
      page_type: same_stack_reference
      location_object: airport_preferred
      use_for: Explain same-stack market consensus.
      do_not_use_for: Do not replace EBBR with a generic Brussels page.
  supporting_sources:
    - family: official_aviation_weather
      page_type: airport_weather
      location_object: airport
      use_for: Sanity-check cloud and wind.
    - family: checkwx
      page_type: metar_taf
      location_object: airport
      use_for: Check the current airport observation.
    - family: accuweather
      page_type: airport_page
      location_object: airport
      use_for: Cross-check the daily high and timing.
  forbidden_sources:
    - family: wunderground
      page_type: city_page
      location_object: city
      why_forbidden: A Brussels city page is not the EBBR airport contract.
    - family: accuweather
      page_type: city_page
      location_object: city
      why_forbidden: Urban pages can differ from the airport object.
    - family: meteoblue
      page_type: city_page
      location_object: city
      why_forbidden: Use only to explain market drift.

operator_notes:
  summary: Brussels is a sensible extension city when you want a marine-inland mix that still has strong airport data coverage. The main risk is low cloud or frontal timing, not violent intraday spikes.
  why_this_station: EBBR is a clean airport identity and lines up well with the airport-first resolution framework.
  main_risks:
    - Low cloud suppressing the afternoon peak.
    - Quick frontal passages.
    - Brussels city pages overstating urban warmth.
  common_wrong_anchor:
    - Generic Brussels city pages instead of EBBR.
    - Benelux regional summaries with no station match.
  usage_order:
    - Open Polymarket rules and confirm EBBR plus Celsius.
    - Open same-station WU Hourly and record target-day high plus likely peak hour.
    - Open same-station WU History / Daily to verify station identity and later use it for settlement review.
    - Check airport support pages if cloud or drizzle is a concern.
    - Use city pages only to judge market noise.
